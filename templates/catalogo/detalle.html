{% extends 'base.html' %}
{% block content %}
<a href="{% url 'lista_items' %}" class="btn btn-outline-secondary btn-sm mb-3">← Volver</a>
<div class="card p-4 mb-4">
    <h1>{{ item.titulo }} <small class="text-muted">({{ item.anio }})</small></h1>
    <p class="badge bg-info text-dark w-auto align-self-start">{{ item.categoria }}</p>
    <p>{{ item.descripcion }}</p>
</div>

<!-- Aquí la Persona B integrará las reseñas -->
{% endblock %}
